name: build-local-release-artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run release:check
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: jev-vtuber-studio-source
          path: |
            dist/*.zip
            dist/*.manifest.json
            dist/*.tgz
            dist/*.sha256
